pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp main-page.html public/index.html
    - cp test.html public/test.html
    - cp logo.png public/logo.png
    - cp blur.png public/blur.png
    - cp bgcopy.png public/bgcopy.png
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
